<mat-card class="form-panel">
    <mat-card-title class="title">कर आकारणी (Tax Generation)</mat-card-title>
    <mat-divider></mat-divider>

    <form class="form-grid" [formGroup]="taxGenerationForm">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label class="text-bold">वार्ड नं</mat-label>
                <mat-select formControlName="ward_number">
                    <mat-option *ngFor="let item of wardOptions" [value]="item.label">
                        {{ item.value }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label class="text-bold">वर्ष (Year)</mat-label>
                <mat-select formControlName="year">
                    <mat-option *ngFor="let year of yearOptions" [value]="year.YEAR_ID">
                        {{ year.YEAR_NAME }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label class="text-bold">ते (To)</mat-label>
                <!-- <mat-select [(value)]="toYearSelected" disabled>
                    <mat-option value="2025">2025</mat-option>
                </mat-select> -->
                <input type="hidden" formControlName="to" readonly />
                <input matInput type="text" formControlName="to1" readonly />
            </mat-form-field>
            <button mat-raised-button color="primary" class="submit-btn" (click)="getTaxGenerationRecords()">कर
                आकारणी</button>
        </div>
    </form>

        <div class="table-responsive mt-4">

            <app-mat-data-table [displayedColumns]="displayedColumns" [dataSource]="pagedDataSource"
                [currentPage]="currentPage"></app-mat-data-table>
            <app-custom-pagination [length]="totalItems" [pageSize]="itemsPerPage" [currentPage]="currentPage"
                (pageChange)="onPageChange($event)"> </app-custom-pagination>
        </div>

    </div>
    <div class="row mt-4">
        <form [formGroup]="totalTaxCalculationForm">
            <div class="form-row">
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण खातेदार:</mat-label>
                    <input matInput type="text" formControlName="totalCount" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण मागील बाकी :</mat-label>
                    <input matInput type="text" formControlName="FGFHH" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण इमारत कर :</mat-label>
                    <input matInput type="text" formControlName="EMARTICHE_KARAAKARNI" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण विज /दिवाबत्ती कर :</mat-label>
                    <input matInput type="text" formControlName="DIVA_BATTI_KAR" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण जमीन कर :</mat-label>
                    <input matInput type="text" formControlName="KHULA_BHUKAND" readonly />
                </mat-form-field>
            </div>
            <div class="form-row">
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण सफाई कर :</mat-label>
                    <input matInput type="text" formControlName="SAFAI_KAR" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण आरोग्य रक्षण कर. :</mat-label>
                    <input matInput type="text" formControlName="AAROGYA_RAKSHAN_KAR" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण विशेष पाणी कर :</mat-label>
                    <input matInput type="text" formControlName="VISHESH_PANI_KAR" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण सामान्य पानी क़र :</mat-label>
                    <input matInput type="text" formControlName="SAMANYA_PANI_KAR" readonly />
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label class="text-bold">एकूण कर :</mat-label>
                    <input matInput type="text" formControlName="TOTAL" readonly />
                </mat-form-field>
            </div>
        </form>
