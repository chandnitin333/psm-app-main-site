<mat-card class="form-panel">
    <mat-card-title class="title">
        <span class="title-text">वसुली धारकाची यादी (Customer List)</span>
        <a mat-stroked-button class="title-button" routerLink="/customer-vasuli">
            <mat-icon>arrow_back</mat-icon>
            Back
        </a>
    </mat-card-title>
    <mat-divider></mat-divider>
    <form class="form-grid" [formGroup]="customerVasuliForm">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label class="text-bold">वर्ष (Year)</mat-label>
                <mat-select formControlName="year_id"> 
                    <mat-option *ngFor="let year of yearOptions" [value]="year.YEAR_ID">
                        {{ year.YEAR_NAME }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label class="text-bold">ते (To)</mat-label>
                <input type="hidden" readonly formControlName="year_id1" />
                <input matInput type="text" readonly formControlName="year_id2" />
            </mat-form-field>
        </div>
        <div class="form-row">
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">अनु. क्रमांक</mat-label>
                <input matInput type="text" formControlName="anu_kramank" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">मालमत्ता क्र.</mat-label>
                <input matInput type="text" formControlName="malmatta_number" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">वॉर्ड क्र.</mat-label>
                <input matInput type="text" formControlName="vard_number" (change)="fetCustomerData()" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">प्लॉट क्र.</mat-label>
                <input matInput type="text" formControlName="plot_no" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">खसरा क्र.</mat-label>
                <input matInput type="text" formControlName="khasara_kramank" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">सर्वे क्र.</mat-label>
                <input matInput type="text" formControlName="survey_kramank" />
            </mat-form-field>
        </div>
    </form>
    <div class="row">
        <mat-card class="example-card">
            <mat-card-title class="text-center"><strong>डेली कर वसुली यादी</strong></mat-card-title>
            <mat-divider></mat-divider>
            <table mat-table [dataSource]="dailyKarVasuliYadi">
                <ng-container matColumnDef="label">
                    <td mat-cell *matCellDef="let element" style="width: 15%;"> {{element.label}} </td>
                </ng-container>
                <ng-container matColumnDef="name">
                    <td mat-cell *matCellDef="let element">
                        <form [formGroup]="customerVasuliForm">
                            <input matInput type="text" style="width: 100%; height: 40px;"
                                [formControlName]="element.name" />
                        </form>
                    </td>
                </ng-container>
                <tr mat-row *matRowDef="let row; columns: ['label', 'name'];"></tr>
            </table>
        </mat-card>
    </div>
    <div class="row mt-5">
        <mat-card class="example-card">
            <table mat-table [dataSource]="karDetails">
                <ng-container matColumnDef="label">
                    <th mat-header-cell *matHeaderCellDef><strong> कर </strong> </th>
                    <td mat-cell *matCellDef="let element"> {{element.label}} </td>
                </ng-container>
                <ng-container matColumnDef="col1">
                    <th mat-header-cell *matHeaderCellDef> <strong>मागील कर </strong></th>
                    <td mat-cell *matCellDef="let element">
                        <ng-container *ngIf="element.col1 === 'date'; else otherInput">
                            <form [formGroup]="customerVasuliForm">
                                <mat-form-field appearance="fill" style=" width: 100%;">
                                    <input matInput [matDatepicker]="picker" appDateFormat placeholder="DD-MM-YYYY"
                                        [formControlName]="element.col2" />
                                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                    <mat-datepicker #picker></mat-datepicker>
                                </mat-form-field>
                            </form>
                        </ng-container>
                        <ng-template #otherInput>
                            <form [formGroup]="customerVasuliForm">
                                <input matInput type="text" style="height: 40px; width: 100%;"
                                    [formControlName]="element.col1" (keyup)="updateCol4(element)" />
                            </form>
                        </ng-template>
                    </td>
                </ng-container>
                <ng-container matColumnDef="col2">
                    <th mat-header-cell *matHeaderCellDef> <strong>चालू कर</strong> </th>
                    <td mat-cell *matCellDef="let element">
                        <ng-container *ngIf="element.col1 !== 'date'">
                            <form [formGroup]="customerVasuliForm">
                                <input matInput type="text" style="width: 100%; height: 40px;"
                                    [formControlName]="element.col2" (keyup)="updateCol4(element)" />
                            </form>
                        </ng-container>
                    </td>
                </ng-container>
                <ng-container matColumnDef="col3">
                    <th mat-header-cell *matHeaderCellDef> <strong>जमा केलेली रक्कम</strong> </th>
                    <td mat-cell *matCellDef="let element">
                        <ng-container *ngIf="element.col1 !== 'date'">
                            <form [formGroup]="customerVasuliForm">
                                <input matInput type="text" style="width: 100%; height: 40px;"
                                    [formControlName]="element.col3" (keyup)="updateCol4(element)">
                                <!-- <input matInput type="text" style="width: 100%; height: 40px;"
                                    [formControlName]="element.col3" /> -->
                            </form>
                        </ng-container>
                    </td>
                </ng-container>
                <ng-container matColumnDef="col4">
                    <th mat-header-cell *matHeaderCellDef><strong> शिल्लक रक्कम </strong></th>
                    <td mat-cell *matCellDef="let element">
                        <ng-container *ngIf="element.col1 !== 'date'">
                            <form [formGroup]="customerVasuliForm">
                                <input matInput type="text" style="width: 100%; height: 40px;"
                                    [formControlName]="element.col4" readonly />
                            </form>
                        </ng-container>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="['label', 'col1', 'col2', 'col3', 'col4']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['label', 'col1', 'col2', 'col3', 'col4'];"></tr>
            </table>
        </mat-card>
    </div>
    <div class="submit-row">
        <button mat-raised-button color="primary" class="submit-btn"
            (click)="(!from_edit)  ? SaveCustomerVasuli() : updateCustomerVasuli()">{{(from_edit) ? "बदल करा" : "जतन
            करा"}}</button>
    </div>
</mat-card>
<br><br>
