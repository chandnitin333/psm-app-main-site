<mat-card class="form-panel">
    <mat-card-title class="title">
        <span class="title-text">मालमत्ता धारकाची यादी (Customer List)</span>

        <!-- <a mat-stroked-button color="danger" class="btn-danger"
            style="background-color: rgb(207, 58, 58); color:#fff; margin-right: 10px" (click)="resetData()">
            Reset
        </a> -->
    </mat-card-title>
    <mat-divider></mat-divider>

    <form class="form-grid" [formGroup]="customerForm">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <input type="hidden" formControlName="user_id" name="user_id" />
                <mat-label class="text-bold">वर्ष (Year)</mat-label>
                <mat-select formControlName="year">
                    <mat-option *ngFor="let year of yearOptions" [value]="year.YEAR_ID">
                        {{ year.YEAR_NAME }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label class="text-bold">ते (To)</mat-label>
                <input type="hidden" formControlName="to" readonly />
                <input matInput type="text" formControlName="to1" readonly />
            </mat-form-field>
        </div>
        <div class="form-row">
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">अनु. क्रमांक</mat-label>
                <input matInput type="text" formControlName="annu_kramank" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">मालमत्ता क्र.</mat-label>
                <input matInput type="text" formControlName="malmatta_no" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">वॉर्ड क्र.</mat-label>
                <input matInput type="text" formControlName="ward_no" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">प्लॉट क्र.</mat-label>
                <input matInput type="text" formControlName="plot_no" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">खसरा क्र.</mat-label>
                <input matInput type="text" formControlName="khasara_no" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">सर्वे क्र.</mat-label>
                <input matInput type="text" formControlName="survey_no" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">खातेदाराचे नाव</mat-label>
                <input matInput type="text" formControlName="khate_dharkache_name"
                    (keypress)="keyDownText($event,'khate_dharkache_name')" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="form-field">
                <mat-label class="text-bold">भोगवटदाराचे नाव</mat-label>
                <input matInput type="text" formControlName="bhogvat_dharak_name"
                    (keypress)="keyDownText($event,'bhogvat_dharak_name')" />
            </mat-form-field>
        </div>


        <div class="submit-row">
            <button mat-raised-button color="primary" class="submit-btn" style="margin-right: 10px"
                (click)="fetchData()">Search</button>
            <a mat-raised-button color="warn" routerLink="/vasuli" class="submit-btn">Add Vasuli</a>
        </div>
    </form>
    <div class="table-responsive mt-4">

        <app-mat-data-table [displayedColumns]="displayedColumns" [dataSource]="pagedDataSource"
            [currentPage]="currentPage" [isEdit]="true" [isDelete]="true" [isView]="false" [isPrint]="false"
            [isDownload]="false" [isPreview]="true" [isKar]="false" (editEvent)="onEdit($event)"
            (deleteEvent)="onDelete($event)" (previewEvent)="onPreview($event)"></app-mat-data-table>
        <app-custom-pagination *ngIf="dataSource && dataSource.data.length > 0" [length]="totalItems"
            [pageSize]="itemsPerPage" [currentPage]="currentPage" (pageChange)="onPageChange($event)">
        </app-custom-pagination>
    </div>
</mat-card>
